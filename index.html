<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#4f46e5">
<meta name="color-scheme" content="light dark">
<meta name="description" content="Anotador de tareas diarias con calendario, porcentaje de cumplimiento y Google Calendar.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Tareas">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>Anotación de tareas</title>
<style>
  :root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
  body{background:var(--bg);color:var(--text)}
  :root{
    --bg:#f4f5fb; --surface:#ffffff; --text:#1c1d2b; --muted:#5d6078; --line:#e3e5f0;
    --primary:#4f46e5; --primary-ink:#ffffff; --primary-soft:#e9e8fd;
    --ok:#15803d; --ok-soft:#dcf5e4; --info:#1d4ed8; --info-soft:#e0eaff;
    --warn:#a35a00; --warn-soft:#fff0d6; --bad:#b91c1c; --bad-soft:#fde3e3;
    --radius:16px; --shadow:0 2px 10px rgba(30,32,70,.08);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){color-scheme:dark;--bg:#12131c; --surface:#1c1e2c; --text:#eef0fb; --muted:#a3a7c2; --line:#2d3047;
      --primary:#8b86ff; --primary-ink:#12131c; --primary-soft:#2b2a55;
      --ok:#4ade80; --ok-soft:#173424; --info:#7aa7ff; --info-soft:#18284d;
      --warn:#fbbf24; --warn-soft:#3b2d10; --bad:#ff8a8a; --bad-soft:#40191b;
      --shadow:none;}
  }
  :root[data-theme="dark"]{color-scheme:dark;--bg:#12131c; --surface:#1c1e2c; --text:#eef0fb; --muted:#a3a7c2; --line:#2d3047;
      --primary:#8b86ff; --primary-ink:#12131c; --primary-soft:#2b2a55;
      --ok:#4ade80; --ok-soft:#173424; --info:#7aa7ff; --info-soft:#18284d;
      --warn:#fbbf24; --warn-soft:#3b2d10; --bad:#ff8a8a; --bad-soft:#40191b;
      --shadow:none;}
  *{box-sizing:border-box}
  html,body{margin:0}
  html{height:auto}
  body{
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    background:var(--bg); color:var(--text); line-height:1.4;
    -webkit-tap-highlight-color:transparent;
  }
  button{font:inherit;color:inherit;cursor:pointer}
  button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--primary);outline-offset:2px}
  .app{max-width:480px;margin:0 auto;padding-block:0 96px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));position:relative}
  header.top{padding:20px 0 12px;display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
  header.top h1{margin:0;font-size:1.4rem;letter-spacing:-.01em}
  header.top p{margin:2px 0 0;color:var(--muted);font-size:.92rem}
  .icon-btn{min-width:44px;min-height:44px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-size:1.15rem}
  .card{background:var(--surface);border-radius:var(--radius);box-shadow:var(--shadow);border:1px solid var(--line);padding:16px;margin-bottom:14px}
  .btn-primary{
    width:100%;min-height:52px;border:0;border-radius:14px;background:var(--primary);color:var(--primary-ink);
    font-weight:700;font-size:1.05rem;display:flex;align-items:center;justify-content:center;gap:8px;
  }
  .btn-primary:active{transform:scale(.99)}
  .btn-secondary{min-height:48px;padding:0 16px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-weight:600}
  .section-title{margin:18px 0 8px;font-size:1rem;color:var(--muted);font-weight:700;letter-spacing:.02em}

  /* progreso mini */
  .mini{display:flex;align-items:center;gap:12px}
  .bar{flex:1;height:10px;background:var(--line);border-radius:99px;overflow:hidden}
  .bar > span{display:block;height:100%;background:var(--primary);border-radius:99px;transition:width .3s}
  .mini b{min-width:3.2ch;text-align:right}

  /* tareas */
  ul.tasks{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
  .task{display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:8px 8px 8px 6px;box-shadow:var(--shadow)}
  .check{width:44px;height:44px;flex:none;border-radius:12px;border:0;background:transparent;display:grid;place-items:center}
  .check i{width:26px;height:26px;border-radius:8px;border:2px solid var(--muted);display:grid;place-items:center;font-style:normal;font-weight:800;font-size:.95rem;color:transparent}
  .task.done .check i{background:var(--ok);border-color:var(--ok);color:#fff}
  .task .info{flex:1;min-width:0}
  .task .name{font-weight:600;overflow-wrap:anywhere}
  .task.done .name{text-decoration:line-through;color:var(--muted)}
  .task .meta{font-size:.82rem;color:var(--muted);margin-top:2px}
  .task .actions{display:flex;gap:2px}
  .task .actions a,.task .actions button{
    min-width:44px;min-height:44px;display:grid;place-items:center;border:0;background:transparent;border-radius:12px;text-decoration:none;font-size:1.1rem;color:inherit
  }
  .empty{text-align:center;color:var(--muted);padding:26px 12px;border:2px dashed var(--line);border-radius:14px}

  /* calendario */
  .cal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
  .cal-head h2{margin:0;font-size:1.1rem;text-transform:capitalize}
  .grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:2px}
  .card.cal{padding:12px 8px}
  .dow{font-size:.75rem;color:var(--muted);text-align:center;padding:4px 0;font-weight:700}
  .day{
    min-width:0;height:44px;border-radius:12px;border:2px solid transparent;background:transparent;
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-weight:600;padding:0
  }
  .day.out{visibility:hidden}
  .day.today{border-color:var(--primary)}
  .day.sel{background:var(--primary);color:var(--primary-ink)}
  .dot{width:6px;height:6px;border-radius:50%;background:var(--primary)}
  .day.sel .dot{background:var(--primary-ink)}
  .dot.all{background:var(--ok)}
  .dot.none{visibility:hidden}

  /* rendimiento */
  .seg{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;background:var(--line);padding:4px;border-radius:14px;margin-bottom:14px}
  .seg button{min-height:44px;border:0;border-radius:11px;background:transparent;font-weight:600;font-size:.92rem}
  .seg button[aria-pressed="true"]{background:var(--surface);box-shadow:var(--shadow);color:var(--primary)}
  .ring-wrap{display:flex;flex-direction:column;align-items:center;gap:6px}
  .ring{position:relative;width:170px;height:170px}
  .ring svg{width:100%;height:100%;transform:rotate(-90deg)}
  .ring .bg{stroke:var(--line)}
  .ring .fg{transition:stroke-dashoffset .5s,stroke .3s}
  .ring .num{position:absolute;inset:0;display:grid;place-items:center;font-size:2.4rem;font-weight:800}
  .ring-wrap .count{color:var(--muted);font-size:.95rem}
  .msg{border-radius:14px;padding:14px 16px;font-weight:700;font-size:1.05rem;text-align:center;margin-top:12px}
  .msg.ok{background:var(--ok-soft);color:var(--ok)}
  .msg.info{background:var(--info-soft);color:var(--info)}
  .msg.warn{background:var(--warn-soft);color:var(--warn)}
  .msg.bad{background:var(--bad-soft);color:var(--bad)}
  .msg.neutral{background:var(--primary-soft);color:var(--primary)}
  .week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;align-items:end;height:120px}
  .week .col{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:4px;height:100%}
  .week .b{width:70%;background:var(--primary);border-radius:6px 6px 2px 2px;min-height:3px}
  .week .b.none{background:var(--line)}
  .week small{font-size:.7rem;color:var(--muted)}
  .week .p{font-size:.68rem;font-weight:700}

  /* nav inferior */
  nav.tabs{
    position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);
    padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px));z-index:5
  }
  nav.tabs .in{max-width:480px;margin:0 auto;display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
  nav.tabs button{min-height:56px;border:0;background:transparent;border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:.78rem;font-weight:600;color:var(--muted)}
  nav.tabs button span{font-size:1.3rem;line-height:1}
  nav.tabs button[aria-current="page"]{color:var(--primary);background:var(--primary-soft)}

  /* modal */
  dialog{border:0;border-radius:20px;padding:0;width:min(440px,calc(100% - 24px));background:var(--surface);color:var(--text);box-shadow:0 20px 60px rgba(0,0,0,.35)}
  dialog::backdrop{background:rgba(10,10,25,.55)}
  form.f{padding:20px;display:flex;flex-direction:column;gap:14px}
  form.f h2{margin:0;font-size:1.2rem}
  label.fld{display:flex;flex-direction:column;gap:6px;font-weight:600;font-size:.92rem}
  input[type=text],input[type=date],input[type=time]{
    min-height:48px;border-radius:12px;border:1px solid var(--line);padding:0 12px;font:inherit;background:var(--bg);color:var(--text);width:100%
  }
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .chk{display:flex;align-items:flex-start;gap:10px;font-weight:500;min-height:44px}
  .chk input{width:22px;height:22px;margin-top:2px;flex:none;accent-color:var(--primary)}
  .chk small{display:block;color:var(--muted);font-weight:400}
  .err{color:var(--bad);font-size:.88rem;min-height:1.2em;margin:0}
  .btns{display:grid;grid-template-columns:1fr 1.4fr;gap:10px}
  .btns .btn-primary{min-height:48px}

  .toast{position:fixed;left:50%;bottom:calc(88px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(20px);background:#1c1d2b;color:#fff;padding:12px 16px;border-radius:12px;font-size:.92rem;opacity:0;pointer-events:none;transition:.25s;max-width:min(440px,calc(100% - 32px));z-index:20;text-align:center}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  .sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
  @media (prefers-reduced-motion: reduce){*{transition:none!important}}

  .toast a{color:#c7c4ff;font-weight:700;text-decoration:underline}
  .toast.link{pointer-events:auto}
  .task .actions button.confirm{background:var(--bad-soft);color:var(--bad);font-weight:700;font-size:.8rem;padding:0 10px}
</style>
</head>
<body>

<div class="app">
  <header class="top">
    <div>
      <h1>Anotación de tareas</h1>
      <p id="subtitle"></p>
    </div>
    <button class="icon-btn" id="btnBell" type="button" aria-label="Activar avisos de recordatorio" title="Activar avisos">🔔</button>
  </header>

  <main id="main" tabindex="-1"></main>
</div>

<nav class="tabs" aria-label="Secciones">
  <div class="in">
    <button type="button" data-view="hoy"><span aria-hidden="true">✅</span>Hoy</button>
    <button type="button" data-view="calendario"><span aria-hidden="true">📅</span>Calendario</button>
    <button type="button" data-view="rendimiento"><span aria-hidden="true">📊</span>Rendimiento</button>
  </div>
</nav>

<dialog id="dlg" aria-labelledby="dlgTitle">
  <form class="f" id="form" method="dialog" novalidate>
    <h2 id="dlgTitle">Agregar nueva tarea</h2>
    <label class="fld">Tarea
      <input type="text" id="fTitle" maxlength="100" placeholder="Ej: Ir al gimnasio" autocomplete="off" required>
    </label>
    <div class="row2">
      <label class="fld">Fecha
        <input type="date" id="fDate" required>
      </label>
      <label class="fld">Hora (opcional)
        <input type="time" id="fTime">
      </label>
    </div>
    <label class="chk"><input type="checkbox" id="fRemind"><span>Recordarme esta tarea<small>Aviso en el teléfono mientras la app esté abierta. Requiere hora.</small></span></label>
    <label class="chk"><input type="checkbox" id="fGcal"><span>Agregar a Google Calendar<small>Se abre Google Calendar para que confirmes el evento.</small></span></label>
    <p class="err" id="fErr" role="alert"></p>
    <div class="btns">
      <button type="button" class="btn-secondary" id="fCancel">Cancelar</button>
      <button type="submit" class="btn-primary">Guardar tarea</button>
    </div>
  </form>
</dialog>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
(function(){
  'use strict';
  if("serviceWorker" in navigator){ window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{})); }

  /* ---------- Utilidades ---------- */
  const pad = n => String(n).padStart(2,'0');
  const ymd = d => d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
  const parse = s => { const [y,m,d]=s.split('-').map(Number); return new Date(y,m-1,d); };
  const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const fmtLong = s => parse(s).toLocaleDateString('es-AR',{weekday:'long',day:'numeric',month:'long'});
  const fmtShort = s => parse(s).toLocaleDateString('es-AR',{day:'numeric',month:'short'});
  const todayStr = () => ymd(new Date());
  const MESES = ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];

  /* ---------- Almacenamiento (localStorage con respaldo en memoria) ---------- */
  const KEY = 'anotacion-tareas-v1';
  let memoryStore = null;
  // Descarta registros inválidos (datos viejos, manipulados o corruptos) para que nunca rompan la pantalla.
  function clean(list){
    return list
      .filter(t => t && typeof t==='object' && typeof t.id==='string' && typeof t.title==='string' && /^\d{4}-\d{2}-\d{2}$/.test(t.date))
      .map(t => ({id:t.id, title:t.title.slice(0,100), date:t.date, time:/^\d{2}:\d{2}$/.test(t.time)?t.time:'',
                  done:t.done===true, remind:t.remind===true, notified:t.notified===true}));
  }
  function load(){
    try{
      const raw = localStorage.getItem(KEY);
      if(raw){ const data = JSON.parse(raw); if(Array.isArray(data)) return clean(data); }
    }catch(e){ if(memoryStore) return memoryStore; }
    return memoryStore || [];
  }
  function save(){
    memoryStore = tasks;
    try{ localStorage.setItem(KEY, JSON.stringify(tasks)); }
    catch(e){ toast('No se pudo guardar en este navegador. Los datos se perderán al cerrar.'); }
  }

  /* ---------- Estado ---------- */
  let tasks = load();
  const now0 = new Date();
  const state = {
    view:'hoy',
    selected: todayStr(),
    calY: now0.getFullYear(),
    calM: now0.getMonth(),
    period:'hoy',
    confirmDel:null
  };
  let confirmTimer;

  const $ = sel => document.querySelector(sel);
  const main = $('#main');

  /* ---------- Lógica de rendimiento ---------- */
  function mondayOf(d){ const x=new Date(d.getFullYear(),d.getMonth(),d.getDate()); x.setDate(x.getDate()-((x.getDay()+6)%7)); return x; }

  // Solo cuentan tareas con fecha igual o anterior a hoy (las futuras aún no se pueden "incumplir").
  function tasksForPeriod(period){
    const today = todayStr();
    const t = parse(today);
    return tasks.filter(k => {
      if(k.date > today) return false;
      if(period==='hoy') return k.date === today;
      if(period==='semana'){ const m=mondayOf(t); const s=ymd(m); const e=new Date(m); e.setDate(e.getDate()+6); return k.date>=s && k.date<=ymd(e); }
      if(period==='mes') return k.date.slice(0,7) === today.slice(0,7);
      return true;
    });
  }
  function stats(list){
    const total = list.length, done = list.filter(k=>k.done).length;
    // floor: solo muestra 100% si de verdad se cumplió todo
    const pct = total ? Math.floor(done*100/total) : 0;
    return {total, done, pct};
  }
  function messageFor(total, pct){
    if(!total) return {cls:'neutral', text:'Todavía no hay tareas para medir. ¡Agregá la primera!'};
    if(pct === 100) return {cls:'ok',   text:'Logramos hacer todo, sigue así'};
    if(pct >= 70)   return {cls:'info', text:'Casi logramos hacer todo, pero es un gran avance'};
    if(pct >= 40)   return {cls:'warn', text:'Deberías mejorar la conducta'};
    return {cls:'bad', text:'Borra esta app por que no te sirve'};
  }
  const ringColor = pct => pct===100 ? 'var(--ok)' : pct>=70 ? 'var(--info)' : pct>=40 ? 'var(--warn)' : 'var(--bad)';

  /* ---------- Google Calendar ---------- */
  function gcalLink(t){
    let dates;
    if(t.time){
      const s = t.date.replace(/-/g,'')+'T'+t.time.replace(':','')+'00';
      const e = new Date(t.date+'T'+t.time); e.setHours(e.getHours()+1);
      dates = s+'/'+ymd(e).replace(/-/g,'')+'T'+pad(e.getHours())+pad(e.getMinutes())+'00';
    }else{
      const n = parse(t.date); n.setDate(n.getDate()+1);
      dates = t.date.replace(/-/g,'')+'/'+ymd(n).replace(/-/g,'');
    }
    let tz = ''; try{ tz = Intl.DateTimeFormat().resolvedOptions().timeZone; }catch(e){}
    return 'https://calendar.google.com/calendar/render?action=TEMPLATE'
      +'&text='+encodeURIComponent(t.title)
      +'&dates='+dates
      +'&details='+encodeURIComponent('Creada desde Anotación de tareas')
      +(tz ? '&ctz='+encodeURIComponent(tz) : '');
  }

  /* ---------- Render ---------- */
  function taskItem(t, showDate){
    const meta = [];
    if(showDate) meta.push(fmtShort(t.date));
    if(t.time) meta.push('🕒 '+t.time);
    if(t.remind) meta.push('🔔 recordatorio');
    return `<li class="task ${t.done?'done':''}" data-id="${t.id}">
      <button class="check" type="button" data-act="toggle" role="checkbox" aria-checked="${t.done}" aria-label="Marcar como ${t.done?'pendiente':'cumplida'}: ${esc(t.title)}"><i aria-hidden="true">✓</i></button>
      <div class="info"><div class="name">${esc(t.title)}</div>${meta.length?`<div class="meta">${esc(meta.join(' · '))}</div>`:''}</div>
      <div class="actions">
        <a href="${gcalLink(t)}" target="_blank" rel="noopener" aria-label="Agregar a Google Calendar: ${esc(t.title)}" title="Google Calendar">📆</a>
        ${state.confirmDel===t.id
          ? `<button type="button" class="confirm" data-act="del" aria-label="Confirmar eliminar: ${esc(t.title)}">¿Seguro?</button>`
          : `<button type="button" data-act="del" aria-label="Eliminar tarea: ${esc(t.title)}" title="Eliminar">🗑️</button>`}
      </div>
    </li>`;
  }
  const sortTasks = list => list.slice().sort((a,b)=> (a.time||'99:99').localeCompare(b.time||'99:99') || a.title.localeCompare(b.title));

  function listHtml(list, showDate){
    if(!list.length) return `<div class="empty">No hay tareas para este día.<br>Tocá “Agregar nueva tarea” para empezar.</div>`;
    return `<ul class="tasks">${sortTasks(list).map(t=>taskItem(t,showDate)).join('')}</ul>`;
  }

  function renderHoy(){
    const today = todayStr();
    const list = tasks.filter(t=>t.date===today);
    const s = stats(list);
    main.innerHTML = `
      <div class="card">
        <div class="mini" aria-label="Progreso de hoy">
          <div class="bar" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${s.pct}"><span style="width:${s.pct}%"></span></div>
          <b>${s.pct}%</b>
        </div>
        <div class="meta" style="color:var(--muted);font-size:.85rem;margin-top:6px">${s.done} de ${s.total} tareas cumplidas hoy</div>
      </div>
      <button class="btn-primary" type="button" data-act="add" data-date="${today}">＋ Agregar nueva tarea</button>
      <h2 class="section-title">TAREAS DE HOY</h2>
      ${listHtml(list,false)}`;
  }

  function renderCalendario(){
    const {calY:y, calM:m, selected} = state;
    const first = new Date(y,m,1);
    const offset = (first.getDay()+6)%7;
    const days = new Date(y,m+1,0).getDate();
    const today = todayStr();
    let cells = ['L','M','X','J','V','S','D'].map(d=>`<div class="dow" aria-hidden="true">${d}</div>`).join('');
    for(let i=0;i<offset;i++) cells += `<button class="day out" tabindex="-1" aria-hidden="true"></button>`;
    for(let d=1; d<=days; d++){
      const ds = y+'-'+pad(m+1)+'-'+pad(d);
      const dayTasks = tasks.filter(t=>t.date===ds);
      const all = dayTasks.length && dayTasks.every(t=>t.done);
      const label = `${d} de ${MESES[m]}${dayTasks.length?`, ${dayTasks.length} ${dayTasks.length===1?'tarea':'tareas'}`:''}`;
      cells += `<button type="button" class="day ${ds===today?'today':''} ${ds===selected?'sel':''}" data-act="pick" data-date="${ds}" aria-label="${label}" ${ds===selected?'aria-pressed="true"':'aria-pressed="false"'}>
        ${d}<span class="dot ${dayTasks.length?(all?'all':''):'none'}"></span></button>`;
    }
    const list = tasks.filter(t=>t.date===selected);
    main.innerHTML = `
      <div class="card cal">
        <div class="cal-head">
          <button class="icon-btn" type="button" data-act="prev" aria-label="Mes anterior">‹</button>
          <h2 aria-live="polite">${MESES[m]} ${y}</h2>
          <button class="icon-btn" type="button" data-act="next" aria-label="Mes siguiente">›</button>
        </div>
        <div class="grid">${cells}</div>
      </div>
      <button class="btn-primary" type="button" data-act="add" data-date="${selected}">＋ Agregar nueva tarea</button>
      <h2 class="section-title" style="text-transform:uppercase">${esc(fmtLong(selected))}</h2>
      ${listHtml(list,false)}`;
  }

  function last7(){
    const out=[]; const t=parse(todayStr());
    for(let i=6;i>=0;i--){
      const d=new Date(t); d.setDate(d.getDate()-i);
      const ds=ymd(d); const l=tasks.filter(k=>k.date===ds); const s=stats(l);
      out.push({ds, dow:['D','L','M','X','J','V','S'][d.getDay()], ...s});
    }
    return out;
  }

  function renderRendimiento(){
    const list = tasksForPeriod(state.period);
    const s = stats(list);
    const msg = messageFor(s.total, s.pct);
    const C = 2*Math.PI*52;
    const periods = [['hoy','Hoy'],['semana','Semana'],['mes','Mes'],['total','Total']];
    const week = last7().map(d=>`<div class="col" title="${esc(fmtShort(d.ds))}">
        <span class="p">${d.total?d.pct+'%':'–'}</span>
        <div class="b ${d.total?'':'none'}" style="height:${d.total?Math.max(d.pct,3):3}%"></div>
        <small>${d.dow}</small></div>`).join('');
    main.innerHTML = `
      <div class="seg" role="group" aria-label="Período">
        ${periods.map(([k,l])=>`<button type="button" data-act="period" data-p="${k}" aria-pressed="${state.period===k}">${l}</button>`).join('')}
      </div>
      <div class="card">
        <div class="ring-wrap">
          <div class="ring" role="img" aria-label="Cumplimiento ${s.pct} por ciento">
            <svg viewBox="0 0 120 120" aria-hidden="true">
              <circle class="bg" cx="60" cy="60" r="52" fill="none" stroke-width="12"/>
              <circle class="fg" cx="60" cy="60" r="52" fill="none" stroke-width="12" stroke-linecap="round"
                stroke="${ringColor(s.pct)}" stroke-dasharray="${C}" stroke-dashoffset="${C*(1-s.pct/100)}"/>
            </svg>
            <div class="num">${s.pct}%</div>
          </div>
          <div class="count">${s.done} de ${s.total} tareas cumplidas</div>
        </div>
        <div class="msg ${msg.cls}" id="perfMsg">${esc(msg.text)}</div>
      </div>
      <div class="card">
        <h2 class="section-title" style="margin-top:0">ÚLTIMOS 7 DÍAS</h2>
        <div class="week">${week}</div>
      </div>
      <p style="color:var(--muted);font-size:.82rem;margin:0 4px">Las tareas con fecha futura no cuentan hasta que llega su día.</p>`;
  }

  function render(){
    document.querySelectorAll('nav.tabs button').forEach(b=>{
      if(b.dataset.view===state.view) b.setAttribute('aria-current','page'); else b.removeAttribute('aria-current');
    });
    const sub = new Date().toLocaleDateString('es-AR',{weekday:'long',day:'numeric',month:'long'});
    $('#subtitle').textContent = sub.charAt(0).toUpperCase()+sub.slice(1);
    if(state.view==='hoy') renderHoy();
    else if(state.view==='calendario') renderCalendario();
    else renderRendimiento();
    updateBell();
  }

  /* ---------- Eventos ---------- */
  document.querySelector('nav.tabs').addEventListener('click', e=>{
    const b = e.target.closest('button[data-view]'); if(!b) return;
    state.view = b.dataset.view; render(); window.scrollTo(0,0);
  });

  main.addEventListener('click', e=>{
    const el = e.target.closest('[data-act]'); if(!el) return;
    const act = el.dataset.act;
    const li = el.closest('.task');
    if(act==='toggle' && li){
      const t = tasks.find(k=>k.id===li.dataset.id); if(t){ t.done=!t.done; save(); render(); }
    }else if(act==='del' && li){
      const t = tasks.find(k=>k.id===li.dataset.id); if(!t) return;
      if(state.confirmDel===t.id){ state.confirmDel=null; tasks = tasks.filter(k=>k!==t); save(); render(); toast('Tarea eliminada'); }
      else{ state.confirmDel=t.id; render(); clearTimeout(confirmTimer); confirmTimer=setTimeout(()=>{state.confirmDel=null;render();},4000); }
    }else if(act==='add'){ openDialog(el.dataset.date);
    }else if(act==='pick'){ state.selected = el.dataset.date; render();
    }else if(act==='prev'){ state.calM--; if(state.calM<0){state.calM=11;state.calY--;} render();
    }else if(act==='next'){ state.calM++; if(state.calM>11){state.calM=0;state.calY++;} render();
    }else if(act==='period'){ state.period = el.dataset.p; render(); }
  });

  /* ---------- Formulario ---------- */
  const dlg = $('#dlg'), form = $('#form');
  const fTitle=$('#fTitle'), fDate=$('#fDate'), fTime=$('#fTime'), fRemind=$('#fRemind'), fGcal=$('#fGcal'), fErr=$('#fErr');

  function openDialog(date){
    form.reset(); fErr.textContent='';
    fDate.value = date || todayStr();
    if(typeof dlg.showModal==='function') dlg.showModal(); else dlg.setAttribute('open','');
    fTitle.focus();
  }
  $('#fCancel').addEventListener('click', ()=> dlg.close());

  form.addEventListener('submit', e=>{
    e.preventDefault();
    const title = fTitle.value.trim();
    if(!title){ fErr.textContent='Escribí el nombre de la tarea.'; fTitle.focus(); return; }
    if(!fDate.value){ fErr.textContent='Elegí una fecha.'; fDate.focus(); return; }
    if(fRemind.checked && !fTime.value){ fErr.textContent='Para el recordatorio elegí una hora.'; fTime.focus(); return; }
    const t = {
      id: Date.now().toString(36)+Math.random().toString(36).slice(2,7),
      title, date:fDate.value, time:fTime.value||'', done:false, remind:fRemind.checked, notified:false
    };
    tasks.push(t); save();
    state.selected = t.date;
    const d = parse(t.date); state.calY=d.getFullYear(); state.calM=d.getMonth();
    dlg.close();
    if(t.remind) askNotifPermission();
    render();
    if(fGcal.checked) toast('Tarea guardada. ', {text:'Abrir en Google Calendar', href:gcalLink(t)});
    else toast('Tarea guardada para el '+fmtShort(t.date));
  });

  /* ---------- Recordatorios (mientras la app esté abierta) ---------- */
  const canNotify = 'Notification' in window;
  function askNotifPermission(){
    if(canNotify && Notification.permission==='default'){ try{ Notification.requestPermission().then(updateBell).catch(()=>{}); }catch(e){} }
  }
  function updateBell(){
    const b = $('#btnBell');
    if(!canNotify){ b.hidden = true; return; }
    const p = Notification.permission;
    b.textContent = p==='granted' ? '🔔' : p==='denied' ? '🔕' : '🔔';
    b.title = p==='granted' ? 'Avisos activados' : p==='denied' ? 'Avisos bloqueados en el navegador' : 'Activar avisos';
    b.setAttribute('aria-label', b.title);
  }
  $('#btnBell').addEventListener('click', ()=>{
    if(!canNotify) return;
    if(Notification.permission==='granted') toast('Avisos activados. Funcionan mientras la app esté abierta.');
    else if(Notification.permission==='denied') toast('Los avisos están bloqueados. Activalos en los ajustes del navegador.');
    else askNotifPermission();
  });
  function checkReminders(){
    const n = new Date(); const today = ymd(n); const hm = pad(n.getHours())+':'+pad(n.getMinutes());
    let changed = false;
    tasks.forEach(t=>{
      if(t.remind && !t.notified && !t.done && t.time && (t.date<today || (t.date===today && t.time<=hm))){
        t.notified = true; changed = true;
        toast('⏰ Recordatorio: '+t.title);
        if(canNotify && Notification.permission==='granted'){ try{ new Notification('Recordatorio de tarea',{body:t.title}); }catch(e){} }
      }
    });
    if(changed) save();
  }
  setInterval(checkReminders, 20000);

  /* ---------- Toast ---------- */
  let toastTimer;
  function toast(text, link){
    const el = $('#toast'); el.textContent = text; el.classList.add('show'); el.classList.remove('link');
    if(link){ const a=document.createElement('a'); a.href=link.href; a.target='_blank'; a.rel='noopener'; a.textContent=link.text; el.appendChild(a); el.classList.add('link'); }
    clearTimeout(toastTimer); toastTimer = setTimeout(()=>el.classList.remove('show'), link?12000:3500);
  }

  render();
  checkReminders();
})();
</script>

</body>
</html>
